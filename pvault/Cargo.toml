[workspace]
members = ["programs/*"]
resolver = "3"

[workspace.package]
edition = "2024"
# minimum workspace rustc version
rust-version = "1.95.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
