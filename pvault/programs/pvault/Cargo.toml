[package]
name = "pvault"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "pvault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = []
test-sbf = []

[dependencies]
# Once anchor-lang is published to crates.io, swap to: anchor-lang = "2.0.0-rc.3"
anchor-lang = { git = "https://github.com/otter-sec/anchor.git", branch = "anchor-next", default-features = false, features = ["alloc", "guardrails"] }
anchor-spl = { git = "https://github.com/otter-sec/anchor.git", branch = "anchor-next", default-features = false, features = ["guardrails"] }

[dev-dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
mollusk-svm = { version = "0.17", default-features = false }
mollusk-svm-programs-token = { version = "0.17", default-features = false, features = ["associated-token", "token"] }
spl-token-interface = { version = "3", default-features = false }
solana-program-pack = { version = "3", default-features = false }
solana-program-runtime = { version = "4", default-features = false }
solana-account = { version = "5", default-features = false }
solana-pubkey = { version = "4", default-features = false, features = ["std"] }
solana-sdk-ids = { version = "3", default-features = false }
bytemuck = { version = "1", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
