[package]
name = "pvault"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "pvault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = []
test-sbf = []

[dependencies]
# Once anchor-lang is published to crates.io, swap to: anchor-lang = "2.0.0-rc.3"
anchor-lang = { git = "https://github.com/otter-sec/anchor.git", branch = "anchor-next" }
anchor-spl = { git = "https://github.com/otter-sec/anchor.git", branch = "anchor-next" }

[dev-dependencies]
mollusk-svm = { version = "0.17" }
mollusk-svm-programs-token = { version = "0.17", features = ["associated-token", "token"] }
spl-token-interface = { version = "3" }
solana-program-pack = { version = "3" }
solana-program-runtime = { version = "4" }
solana-account = { version = "5" }
solana-pubkey = { version = "4" }
solana-sdk-ids = { version = "3" }
bytemuck = { version = "1" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
