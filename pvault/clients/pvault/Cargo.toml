[package]
name = "pvault-client"
version = "0.1.0"
description = "Off-chain types and event decoder for the pvault program"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anchor-lang = { git = "https://github.com/otter-sec/anchor.git", default-features = false, branch = "anchor-next" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("idl-build"))',
  'cfg(target_os, values("solana"))'
] }
