[workspace]
resolver = "2"

exclude = ["pvault"]

members = [
  "crates/error",
  "crates/http",
  "crates/shared",
  "crates/functions/pubsub",
  "crates/functions/api",
  "crates/functions/cron",
  "crates/database",
  "crates/database/migration",
]

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "macros"] }
cloudevents-sdk = { version = "0.9", default-features = false, features = ["axum"] }
google-cloud-pubsub = { version = "1.7", default-features = false }
google-cloud-gax = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
  "time",
] }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
dotenvy = { version = "0.15", default-features = false }
sea-orm = { version = "2", default-features = false, features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "with-chrono",
] }
bytes = { version = "1", default-features = false }
base64 = { version = "0.23", default-features = false }
borsh = { version = "1", default-features = false, features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }

solana-sdk = { version = "5", default-features = false, features = ["full"] }
solana-client = { version = "4", default-features = false }
solana-system-interface = { version = "3", default-features = false }
spl-token-2022-interface = { version = "4", default-features = false }
spl-associated-token-account-interface = { version = "2", default-features = false }
