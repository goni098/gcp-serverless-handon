[workspace]
resolver = "2"

exclude = ["pvault"]

members = [
  "crates/error",
  "crates/http",
  "crates/shared",
  "crates/functions/pvault-subscriber",
  "crates/functions/api",
  "crates/functions/pvault-pusher",
  "crates/functions/pvault-emitter",
  "crates/database",
  "crates/database/migration",
]

[workspace.dependencies]
axum = { version = "0.8", features = ["macros", "http2"] }
cloudevents-sdk = { version = "0.9", features = ["axum"] }
google-cloud-pubsub = "1"
google-cloud-gax = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
sea-orm = { version = "2", default-features = false, features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "with-chrono",
] }
bytes = { version = "1" }
base64 = { version = "0.23" }
borsh = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

solana-sdk = { version = "5" }
solana-client = { version = "4" }
solana-system-interface = { version = "3" }
spl-token-2022-interface = { version = "4" }
spl-associated-token-account-interface = { version = "2" }

