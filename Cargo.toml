[workspace]
resolver = "2"

exclude = ["pvault"]

members = [
  "crates/app-error",
  "crates/shared-function",
  "crates/shared",
  "crates/functions/pvault-subscriber",
  "crates/functions/api",
  "crates/functions/pvault-pusher",
  "crates/functions/pvault-emitter",
  "crates/database",
  "crates/database/migration",
  "crates/pvault",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "http2",
  "json",
  "macros",
  "tokio",
  "tracing",
] }
http = { version = "1", default-features = false, features = ["std"] }
cloudevents-sdk = { version = "0.9", default-features = false, features = ["axum"] }
google-cloud-pubsub = { version = "1", default-features = false, features = [
  "default-rustls-provider",
] }
google-cloud-gax = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
  "time",
] }
thiserror = { version = "2", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "tracing-log",
] }
dotenvy = { version = "0.15", default-features = false }
sea-orm = { version = "2", default-features = false, features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "with-chrono",
] }
bytes = { version = "1", default-features = false, features = ["std"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
borsh = { version = "1", default-features = false, features = ["std", "derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

solana-sdk = { version = "5", default-features = false, features = ["full"] }
solana-signature = { version = "3", default-features = false, features = ["std"] }
solana-client = { version = "4", default-features = false }
solana-system-interface = { version = "3", default-features = false }
spl-token-2022-interface = { version = "4", default-features = false }
spl-associated-token-account-interface = { version = "2", default-features = false }

