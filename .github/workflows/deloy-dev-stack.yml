name: Deploy dev stack

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Check Rust formatting
        run: |
          cargo +nightly fmt --all --check
          cargo +nightly fmt --manifest-path pvault/Cargo.toml --all --check

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
          package_json_file: infra/package.json

      - name: Check Pulumi formatting and lint
        working-directory: infra
        run: |
          pnpm install --frozen-lockfile
          pnpm run format:check
          pnpm run lint

      - name: Run Clippy on the server workspace
        run: cargo +stable clippy --locked --workspace -- -D warnings

      - name: Run Clippy on the pvault workspace
        working-directory: pvault
        run: cargo +stable clippy --locked --workspace -- -D warnings

  deploy:
    needs: checks
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
          package_json_file: infra/package.json

      - name: Install Pulumi project dependencies
        working-directory: infra
        run: pnpm install --frozen-lockfile

      - name: Set up native AMD64 Buildx builder
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: deploy-amd64

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy dev stack
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ vars.PULUMI_DEV_STACK }}
          work-dir: infra
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
