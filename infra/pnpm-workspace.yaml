# Don't run protobufjs's unnecessary install script (pnpm 11 fails install unless it's listed here).
# https://github.com/protobufjs/protobuf.js/pull/2299
allowBuilds:
  protobufjs: false
  # Pulumi installs the provider when needed during preview/up.
  "@pulumi/docker-build": false
  "@pulumi/random": false
